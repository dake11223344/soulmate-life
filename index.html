function pickSoulmate(){
 const ranked=npcs.map((n,i)=>({i:i,n:n,score:compatibility(n)})).filter(x=>!x.n.blocked).sort((a,b)=>b.score-a.score);
 if(!ranked.length)return;
 const soulmate=ranked[0];
 const strong=ranked.slice(1,6);
 const remaining=ranked.slice(6);
 const seed=(state.name||"player").split("").reduce((a,ch)=>a+ch.charCodeAt(0),0)+(state.age||0)*17;
 const rotated=remaining.length?remaining.slice(seed%remaining.length).concat(remaining.slice(0,seed%remaining.length)):[];
 const risky=rotated.slice(0,10);
 const unavailable=rotated.slice(10);
 state.soulmate=soulmate.n.name;
 state.relationshipDestiny={
  soulmate:soulmate.i,
  strong:strong.map(x=>x.i),
  risky:risky.map(x=>x.i),
  unavailable:unavailable.map(x=>x.i)
 };
 saveGame();
}

 const d=state.relationshipDestiny;
 if(!d||!Number.isInteger(d.soulmate)||!Array.isArray(d.strong)||d.strong.length!==5||!Array.isArray(d.risky)||d.risky.length!==10)pickSoulmate();
}

 }

   const target=friendAdviceTarget(fi);
   if(target!=null)addIncomingMessage(fi,{friendDatingAdvice:true,target:target,text:friendDatingAdvice(fi,target)});
  }
 });
 const ids=Array.isArray(state.contacts)?state.contacts.map(Number):[];
 const eligible=ids.filter(i=>affinity(i)>=8 || friendIds.includes(i));
 eligible.forEach(function(i,idx){
  if(handled.includes(i)||Object.values(state.incomingMessages).some(m=>m&&m.day===day&&m.sender===i))return;
  const n=npcs[i],chance=n.textStyle==="frequent"?4:n.textStyle==="warm"?6:8;
  if((day+i*3+idx)%chance!==0)return;
  addIncomingMessage(i,{template:(day+i)%incomingMessageTemplates.length});
 });
 saveGame();
}
function incomingCount(){ensureIncoming();return Object.values(state.incomingMessages).filter(m=>m&&!m.read).length}

  const t=incomingMessageTemplates[m.template];return '<div class="card"><h3>📩 New message from '+n.name.split(" ")[0]+'</h3><p><b>'+n.name.split(" ")[0]+':</b> '+t.text+'</p><button class="primary" onclick="openIncomingKey(\''+key+'\')">Reply</button><button class="secondary" onclick="ignoreIncomingKey(\''+key+'\')">Ignore for now</button></div>';
 }).join("");
}
function morningMessage(){return incomingCards()}

 ensureIncoming();const m=state.incomingMessages[key];if(!m)return day();const target=Number(m.target),dayNum=state.day||1,i=Number(m.sender);
