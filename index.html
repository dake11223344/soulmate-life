 else if(n.textStyle==="frequent"){gain+=2;reaction="連絡を取り合うのが好きみたい。返信も楽しそう。";}
 else reaction="自然に会話が続いた。";
 addAffinity(i,gain);
 const you=["私はけっこう好きかも。","最近ちょうど気になってた。","それについて話したかった！","私はこういうの、わりと大事だと思う。","うーん、私は少し違うかな。","それ面白いね。私はどうだろう。","わかる！私も似た感じ。","へえ、もっと聞きたい。"][v.id%8];
 A.innerHTML=`<h2>${v.icon} ${v.topic}</h2><div class="card"><p><b>${n.name.split(" ")[0]}:</b> ${v.opener} 「${v.topic}」ってどう思う？</p><p><b>あなた:</b> ${you}</p><p><b>${n.name.split(" ")[0]}:</b> ${v.reply}</p><div class="event">${timing}<br>${reaction}</div><button class="secondary" onclick="messageMenu(${i})">← メッセージへ</button></div>`;
}
function askDate(i){
 const n=npcs[i],a=affinity(i);
 let threshold=n.dateStyle==="casual"?8:n.dateStyle==="balanced"?25:42;
 const available=npcAvailable(i),accepted=a>=threshold&&available;
 if(accepted){addAffinity(i,5);A.innerHTML=`<div class="card"><h2>💕 デートの約束</h2><p><b>あなた:</b> 今度、二人で出かけない？</p><p><b>${n.name.split(" ")[0]}:</b> ${n.dateStyle==="casual"?"もちろん。楽しそう、行こう！":"いいね。行こう！"}</p><button class="primary" onclick="dateScene(${i})">デートへ</button><button class="secondary" onclick="messageMenu(${i})">あとで</button></div>`}
 else A.innerHTML=`<div class="card"><h2>💬 ${n.name}</h2><p><b>${n.name.split(" ")[0]}:</b> ${!available?"今日は予定が合わなさそう。また別の時間に誘って。":"ごめん、もう少しお互いを知ってからがいいかな。"}</p><button class="primary" onclick="messageMenu(${i})">戻る</button></div>`;
}
function incomingDate(i){
 const n=npcs[i];A.innerHTML=`<div class="card"><h2>📩 ${n.name}</h2><p><b>${n.name.split(" ")[0]}:</b> 今度${n.schedule==="weekendday"?"休日の昼":n.schedule==="flexible"?"時間あるとき":n.schedule==="shift"?"予定が合う日":"夜"}、時間ある？よかったら一緒に出かけない？</p><button class="primary" onclick="dateScene(${i})">💕 行く</button><button class="secondary" onclick="messageMenu(${i})">今回はやめておく</button></div>`;
}
function morningMessage(){
 const ids=Array.isArray(state.contacts)?state.contacts:[]; if(!ids.length)return "";
 const eligible=ids.filter(i=>affinity(i)>=12);
 if(!eligible.length)return "";
 const day=state.day||1, i=eligible[(day*7)%eligible.length],n=npcs[i];
 const chance=n.textStyle==="frequent"?2:n.textStyle==="warm"?4:6;
 if((day+i*3)%chance!==0)return "";
 addAffinity(i,2);
 return `<div class="card"><h3>📩 朝のメッセージ</h3><p><b>${n.name.split(" ")[0]}:</b> おはよう。今日は何してる？</p><button class="option" onclick="messageMenu(${i})">返信する</button></div>`;
}
function dateScene(i){
 if((state.dailyActions||0)>=(state.maxDailyActions||4)){A.innerHTML='<div class="card"><h2>🌙 今日はもう疲れた</h2><p>今日はこれ以上デートできません。</p><button class="primary" onclick="day()">戻る</button></div>';return}
 state.dailyActions=(state.dailyActions||0)+2;
 const n=npcs[i];addAffinity(i,10);state.stress=Math.max(0,(state.stress||0)-12);state.energy=Math.max(0,(state.energy||0)-15);
 A.innerHTML=`<div class="card" style="text-align:center"><div class="portrait">${n.emoji}</div><h2>💕 ${n.name}とデート</h2><p>カフェでゆっくり話して、一緒に街を歩いた。前より少し自然に話せるようになった。</p><p class="small">💗 +10　🧠 ストレス -12　⚡ -15</p><button class="primary" onclick="day()">デートを終える</button></div>`;
}
function relationships(){
 A.innerHTML=`<h2>❤️ 人間関係</h2><div class="card"><h3>知り合い</h3><p class="small">人間関係 screen</p></div><button class="secondary" onclick="render()">← 戻る</button>${nav()}`
}
function nav(){return `<div class="nav"><button class="ghost" onclick="render()">🏠 生活</button><button class="ghost" onclick="relationships()">❤️ 人間関係</button><button class="ghost" onclick="phone()">📱 スマホ</button><button class="ghost" onclick="goOut()">🗺️ 出かける</button></div>`}
function render(){var screens={title:title,create:create,quiz:quiz,day:day};(screens[state.screen]||title)()}
function bootGame(){
 if(!A)return;
 window.nextPeriod=nextPeriod; window.goOut=goOut; window.meetAt=meetAt; window.getMeeting=getMeeting; window.talk=talk; window.day=day; window.endDay=endDay;
 window.work=work; window.shopping=shopping; window.buyItem=buyItem; window.refresh=refresh; window.render=render; window.conversation=conversation; window.chooseConversation=chooseConversation;
 window.topicMenu=topicMenu; window.topicList=topicList; window.morningMessage=morningMessage; window.askContactChoice=askContactChoice; window.contactYes=contactYes; window.phone=phone; window.openContact=openContact; window.messageMenu=messageMenu; window.casualMessage=casualMessage; window.askDate=askDate; window.incomingDate=incomingDate; window.dateScene=dateScene; window.relationships=relationships;
 render();
}
document.addEventListener("click",function(e){
 const shop=e.target.closest&&e.target.closest("[data-shop]");
 if(shop){e.preventDefault();buyItem(Number(shop.getAttribute("data-shop")));return}
 const back=e.target.closest&&e.target.closest("[data-shop-back]");
 if(back){e.preventDefault();day();return}
});
document.addEventListener("click",function(e){
 const b=e.target.closest&&e.target.closest("[data-go-place]");
 if(b){e.preventDefault();meetAt(Number(b.getAttribute("data-go-place")))}
});
try{bootGame()}catch(e){A=document.querySelector("#app");A.innerHTML=`<div class="card"><h2>読み込みエラー</h2><p>${e.message}</p><button class="primary" onclick="location.reload()">もう一度読み込む</button></div>`}
</script></body></html>
