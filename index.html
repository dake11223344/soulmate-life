 state.stress=Math.max(0,Math.min(100,state.stress||0));

 const c=calendarInfo(),low=moodCheck(),worked=state.workedDay===c.d;

function npcInterests(n,i){
 const t=n.traits||{},tags=[];
 if(t.adventure>=60)tags.push("outdoor","adventure","fitness");
 if(t.social>=65)tags.push("social","nightlife","music");
 if(t.social<=40)tags.push("quiet","books","geek","movies");
 if(t.career>=65)tags.push("coffee","fitness");
 if(t.family>=65)tags.push("food","pets","calm");
 if((i%5)===0)tags.push("art","creative");
 if((i%7)===0)tags.push("games","geek");
 return [...new Set(tags)];
}
function useHours(h){
 state.periodHours=state.periodHours==null?4:state.periodHours;
 if(state.periodHours<h){
  if(state.period==="morning"){state.period="afternoon";state.time="1:00 PM";state.periodHours=4}
  else if(state.period==="afternoon"){state.period="night";state.time="7:00 PM";state.periodHours=4}
  else {state.day=(state.day||1)+1;state.energy=100;state.stress=Math.max(0,(state.stress||0)-5);state.dailyActions=0;state.period="morning";state.time="7:00 AM";state.periodHours=4;}
 }
 state.periodHours-=h;
 if(state.periodHours<=0){
  if(state.period==="morning"){state.period="afternoon";state.time="1:00 PM";state.periodHours=4}
  else if(state.period==="afternoon"){state.period="night";state.time="7:00 PM";state.periodHours=4}
 }
 return true;
}

function meetAt(placeIndex){

  const place=Number(placeIndex),m=getMeeting(place);if(!m)throw new Error("出会いデータが見つかりません");

  if((state.money||0)<m.cost){A.innerHTML='<div class="card"><h2>💵 お金が足りません</h2><button class="primary" onclick="goOut()">Back</button></div>';return}
  state.encounterCount=(state.encounterCount||0)+1;
  let candidates=npcs.map((n,idx)=>idx).filter(idx=>!npcs[idx].blocked&&npcInterests(npcs[idx],idx).some(t=>m.tags.includes(t)));

  const n=npcs[window.currentNpc];state.money-=m.cost;useHours(m.hours);

 const eligible=ids.filter(i=>affinity(i)>=8);if(!eligible.length)return;
 const day=state.day||1;if(Object.values(state.incomingMessages).some(m=>m&&m.day===day))return;
 const i=eligible[(day*7+eligible.length)%eligible.length],n=npcs[i];const chance=n.textStyle==="frequent"?2:n.textStyle==="warm"?3:5;
 if((day+i*3)%chance!==0)return;

}

 if(!entries.length)return "";
 const [i,m]=entries[0],n=npcs[Number(i)],t=incomingMessageTemplates[m.template];
 return `<div class="card"><h3>📩 New message from ${n.name.split(" ")[0]}</h3><p><b>${n.name.split(" ")[0]}:</b> ${t.text}</p><button class="primary" onclick="openIncoming(${i})">Reply</button><button class="secondary" onclick="ignoreIncoming(${i})">Ignore for now</button></div>`;
}
function openIncoming(i){
 i=Number(i);ensureIncoming();const m=state.incomingMessages[i];if(!m)return phone();const n=npcs[i],t=incomingMessageTemplates[m.template];m.read=true;saveGame();
 A.innerHTML=`<h2>📩 ${n.name.split(" ")[0]}</h2><div class="card"><p><b>${n.name.split(" ")[0]}:</b> ${t.text}</p><p class="small">Choose your reply</p>${t.choices.map((x,k)=>`<button class="option" onclick="replyIncoming(${i},${k})">${x.text}</button>`).join("")}<button class="secondary" onclick="ignoreIncoming(${i})">Ignore for now</button></div>`;
}
function replyIncoming(i,k){
 i=Number(i);k=Number(k);ensureIncoming();const m=state.incomingMessages[i];if(!m)return phone();const n=npcs[i],t=incomingMessageTemplates[m.template],ch=t.choices[k]||t.choices[0];
 addAffinity(i,3);delete state.incomingMessages[i];saveGame();
 A.innerHTML=`<h2>💬 ${n.name.split(" ")[0]}</h2><div class="card"><p><b>You:</b> ${ch.text}</p><p><b>${n.name.split(" ")[0]}:</b> ${ch.reply}</p><button class="primary" onclick="messageMenu(${i})">Keep talking</button><button class="secondary" onclick="day()">Back to day</button></div>`;
}
function ignoreIncoming(i){
 i=Number(i);ensureIncoming();const m=state.incomingMessages[i];if(m)m.read=true;saveGame();day();
}
function dateScene(i){
 if((state.dailyActions||0)>=(state.maxDailyActions||4)){A.innerHTML='<div class="card"><h2>🌙 今日はもう疲れた</h2><p>今日はこれ以上デートできません。</p><button class="primary" onclick="day()">Back</button></div>';return}
 state.dailyActions=(state.dailyActions||0)+2;
 const n=npcs[i];addAffinity(i,10);state.stress=Math.max(0,(state.stress||0)-12);state.energy=Math.max(0,(state.energy||0)-15);
 A.innerHTML=`<div class="card" style="text-align:center"><div class="portrait">${n.emoji}</div><h2>💕 ${n.name}とデート</h2><p>カフェでゆっくり話して、一緒に街を歩いた。前より少し自然に話せるようになった。</p><p class="small">💗 +10　🧠 ストレス -12　⚡ -15</p><button class="primary" onclick="day()">デートを終える</button></div>`;
}
function relationships(){
 A.innerHTML=`<h2>❤️ 人間関係</h2><div class="card"><h3>知り合い</h3><p class="small">人間関係 screen</p></div><button class="secondary" onclick="render()">← Back</button>${nav()}`
}
function nav(){const unread=incomingCount();return `<div class="nav"><button class="ghost" onclick="render()">🏠 Life</button><button class="ghost" onclick="relationships()">❤️ Relationships</button><button class="ghost" onclick="phone()">📱 Phone${unread?` (${unread})`:""}</button><button class="ghost" onclick="goOut()">🗺️ Go out</button></div>`}
function render(){saveGame();var screens={title:title,create:create,quiz:quiz,day:day};(screens[state.screen]||title)()}
function bootGame(){
 if(!A)return;
 loadGame();
 setInterval(saveGame,3000);
 window.addEventListener("beforeunload",saveGame);
 window.nextPeriod=nextPeriod; window.goOut=goOut; window.meetAt=meetAt; window.getMeeting=getMeeting; window.talk=talk; window.day=day; window.endDay=endDay;
 window.work=work; window.shopping=shopping; window.buyItem=buyItem; window.refresh=refresh; window.render=render; window.conversation=conversation; window.chooseConversation=chooseConversation;
 window.randomMessage=randomMessage; window.topicMenu=topicMenu; window.casualMessage=casualMessage; window.morningMessage=morningMessage; window.askContactChoice=askContactChoice; window.contactYes=contactYes; window.phone=phone; window.openContact=openContact; window.messageMenu=messageMenu; window.casualMessage=casualMessage; window.dateScene=dateScene; window.relationships=relationships;
 render();
}
document.addEventListener("click",function(e){
 const shop=e.target.closest&&e.target.closest("[data-shop]");
 if(shop){e.preventDefault();buyItem(Number(shop.getAttribute("data-shop")));return}
 const back=e.target.closest&&e.target.closest("[data-shop-back]");
 if(back){e.preventDefault();day();return}
});
document.addEventListener("click",function(e){
 const b=e.target.closest&&e.target.closest("[data-go-place]");
 if(b){e.preventDefault();meetAt(Number(b.getAttribute("data-go-place")))}
});
try{bootGame()}catch(e){const app=document.querySelector("#app");if(app){app.innerHTML=`<div class="card"><h2>読み込みエラー</h2><p>${String(e.message||e)}</p><button class="primary" onclick="location.reload()">もう一度読み込む</button></div>`;}}
</script></body></html>
