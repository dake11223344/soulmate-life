function create(){state.avatarTab=state.avatarTab||"face";state.look.eyeColor=state.look.eyeColor||0;const defs={face:["丸型","卵型","面長","ベース型","逆三角形","ハート型","ひし形"],hair:["ストレート","レイヤー","ロング","ミディアム","ボブ","ショート","ポニーテール","お団子","ハーフアップ","三つ編み"],eye:["丸目","やや丸目","切れ長","タレ目","つり目","奥二重","二重"],brow:["ストレート","アーチ","平行","上がり","下がり","太め","細め"],nose:["小さめ","丸め","細め","高め","低め","鷲鼻","やや上向き"],mouth:["薄め","普通","ふっくら","大きめ","上向き","M字"]},labs={face:"顔の輪郭",hair:"髪型",color:"髪の色",eye:"目",brow:"眉",nose:"鼻",mouth:"口",skin:"肌の色"},tab=state.avatarTab;function choices(){if(tab==="skin"||tab==="color"){let cs=tab==="skin"?["#f7d9c4","#efc3a5","#dda57e","#bf805e","#925c43","#613b2d"]:["#38231e","#6b4030","#a76a43","#d7aa70","#171515","#8b2635","#c77d88","#71635e","#aaa"];return cs.map((x,i)=>'<button class="featureChoice '+(state.look[tab]===i?"on":"")+'" onclick="state.look.'+tab+'='+i+';create()"><span class="sample" style="background:'+x+'"></span></button>').join("")}let cls={face:"faceSample",hair:"hairSample",eye:"eyeSample",brow:"browSample",nose:"noseSample",mouth:"mouthSample"}[tab];return defs[tab].map((x,i)=>'<button class="featureChoice '+(state.look[tab]===i?"on":"")+'" onclick="state.look.'+tab+'='+i+';create()"><span class="sample '+cls+'" style="--c:'+["#38231e","#6b4030","#a76a43","#d7aa70","#171515"][i%5]+'"></span>'+x+'</button>').join("")}
