function creatorPortrait(){let sk=["#f7d9c4","#efc3a5","#dda57e","#bf805e","#925c43","#613b2d"][state.look.skin%6],hc=["#38231e","#6b4030","#a76a43","#d7aa70","#171515","#8b2635","#c77d88","#71635e","#aaa"][state.look.color%9],ec=["#754b2e","#9a7138","#49634d","#526b7e","#33251f"][state.look.eyeColor||0],sh=["48% 48% 52% 52%","45% 45% 50% 50%","43% 43% 54% 54%","40% 40% 46% 46%","52% 52% 40% 40%","48% 48% 58% 58%","43% 43% 52% 52%"][state.look.face%7];return '<div class="portraitSilhouette" style="--skin:'+sk+';--hair:'+hc+';--eye:'+ec+';--faceShape:'+sh+'"><i class="hairBack"></i><i class="neck"></i><i class="face"></i><i class="hairTop"></i><i class="brow l"></i><i class="brow r"></i><i class="eye l"></i><i class="eye r"></i><i class="nose"></i><i class="mouth"></i><i class="body"></i></div>'}
function create(){state.avatarTab=state.avatarTab||"face";state.look.eyeColor=state.look.eyeColor||0;const defs={face:["丸型","卵型","面長","ベース型","逆三角形","ハート型","ひし形"],hair:["ストレート","レイヤー","ロング","ミディアム","ボブ","ショート","ポニーテール","お団子","ハーフアップ","三つ編み"],eye:["丸目","やや丸目","切れ長","タレ目","つり目","奥二重","二重"],brow:["ストレート","アーチ","平行","上がり","下がり","太め","細め"],nose:["小さめ","丸め","細め","高め","低め","鷲鼻","やや上向き"],mouth:["薄め","普通","ふっくら","大きめ","上向き","M字"]},labs={face:"顔の輪郭",hair:"髪型",color:"髪の色",eye:"目",brow:"眉",nose:"鼻",mouth:"口",skin:"肌の色"},tab=state.avatarTab;function choices(){if(tab==="skin"||tab==="color"){let cs=tab==="skin"?["#f7d9c4","#efc3a5","#dda57e","#bf805e","#925c43","#613b2d"]:["#38231e","#6b4030","#a76a43","#d7aa70","#171515","#8b2635","#c77d88","#71635e","#aaa"];return cs.map((x,i)=>'<button class="featureChoice '+(state.look[tab]===i?"on":"")+'" onclick="state.look.'+tab+'='+i+';create()"><span class="sample" style="background:'+x+'"></span></button>').join("")}let cls={face:"faceSample",hair:"hairSample",eye:"eyeSample",brow:"browSample",nose:"noseSample",mouth:"mouthSample"}[tab];return defs[tab].map((x,i)=>'<button class="featureChoice '+(state.look[tab]===i?"on":"")+'" onclick="state.look.'+tab+'='+i+';create()"><span class="sample '+cls+'" style="--c:'+["#38231e","#6b4030","#a76a43","#d7aa70","#171515"][i%5]+'"></span>'+x+'</button>').join("")}
A.innerHTML='<div class="maker"><div class="creatorHeader"><h2>主人公を作成</h2><div class="creatorSteps"><i class="on"></i><i></i><i></i><i></i></div></div><div class="characterStage"><div class="characterPortrait">'+creatorPortrait()+'</div></div><div class="card"><label>名前（ニックネーム）</label><input id="nm" value="'+state.name+'" placeholder="名前を入力"><br><br><label>年齢</label><select id="age">'+Array.from({length:14},(_,i)=>'<option '+(state.age==22+i?"selected":"")+'>'+(22+i)+'</option>').join("")+'</select></div><div class="card"><h3>あなたの性別</h3><div class="row"><button class="option '+(state.gender==="female"?"selected":"")+'" onclick="state.gender=\'female\';create()">女性</button><button class="option '+(state.gender==="male"?"selected":"")+'" onclick="state.gender=\'male\';create()">男性</button></div><h3>恋愛対象</h3><div class="row"><button class="option '+(state.target==="female"?"selected":"")+'" onclick="state.target=\'female\';create()">女性</button><button class="option '+(state.target==="male"?"selected":"")+'" onclick="state.target=\'male\';create()">男性</button></div></div><div class="card"><div class="featureTabs">'+Object.keys(labs).map(k=>'<button class="'+(tab===k?"on":"")+'" onclick="state.avatarTab=\''+k+'\';create()">'+labs[k]+'</button>').join("")+'</div><h3>'+labs[tab]+'</h3><div class="featureChoices">'+choices()+'</div></div><button class="primary" onclick="state.name=document.querySelector(\'#nm\').value||\'Mika\';state.age=+document.querySelector(\'#age\').value;state.screen=\'quiz\';render()">次へ　›</button></div>'}
function quiz(){let q=questions[state.q]; if(!q){pickSoulmate();state.screen="day";return render()} A.innerHTML=`<div class="small">質問 ${state.q+1} / ${questions.length}</div><div class="card"><h2>${q[0]}</h2>${q[1].map((o,i)=>`<button class="option" onclick="answer(${i})">${o[0]}</button>`).join("")}</div>`}
function selectFace(i){state.look.face=i;render()}
function selectEye(i){state.look.eye=i;render()}
function answer(i){let [k,d]=questions[state.q][1][i][1];state.score[k]=Math.max(0,Math.min(100,state.score[k]+d));state.q++;render()}
function day(){A.innerHTML=`<div class="statbar"><span class="pill">🌸 1年目</span><span class="pill">Mon 7:00 AM</span><span class="pill">💵 $${state.money}</span><span class="pill">⚡ ${state.energy}</span></div><div class="card"><h2>1日目 — 自宅</h2><p class="event">新しい一年が始まった。今日は9:00から仕事。仕事の後は自由に過ごせる。</p><button class="primary" onclick="work()">💼 仕事へ行く</button><button class="secondary" onclick="goOut()">🗺️ 出かける</button></div>${nav()}`}
function work(){state.money+=168;state.energy-=20;A.innerHTML=`<div class="statbar"><span class="pill">Mon 5:00 PM</span><span class="pill">💵 $${state.money}</span><span class="pill">⚡ ${state.energy}</span></div><div class="card"><h2>仕事が終わった</h2><p>今日は大きな問題もなく終了した。</p><p class="small">+$168　⚡ -20</p><button class="primary" onclick="goOut()">仕事帰りに出かける</button><button class="secondary" onclick="state.screen='day';render()">家に帰る</button></div>`}
let currentNpc=0,convoStep=0;
const meetings=[
{place:"☕ カフェ",cost:8,intro:"窓際の席に座ろうとすると、近くにいた男性と目が合った。",open:"ここのコーヒーけっこう好きなんだ。僕はいつもラテ頼むんだけど、君はコーヒー好き？",qs:["そうなんだ。僕、今日は仕事帰りなんだ。君も仕事してる？","僕は理学療法士をしてるよ。仕事じゃない日は何してることが多い？","僕は休みの日、散歩したり新しい店を探すのが好き。最近どこかいいところ行った？"]},
{place:"🌳 公園",cost:0,intro:"ベンチの近くで落としたイヤホンを拾ってくれた男性と話すことになった。",open:"これ、君のだよね？よかった。僕ここでよく散歩するんだけど、君もよく来る？",qs:["今日は天気いいよね。外で過ごすの好き？","僕は普段ソフトウェアの仕事してて座りっぱなしだから、休みは歩きたくなるんだ。君はどんな仕事してる？","この辺でおすすめの場所とかある？"]},
{place:"🛍️ ショッピング",cost:15,intro:"商品を取ろうとしたタイミングが重なって、隣の男性と笑ってしまった。",open:"あ、ごめん。どうぞ。これ人気なのかな？君も初めて買う？",qs:["買い物って決めてから来るタイプ？それとも見ながら決める？","僕は仕事柄、人と話すこと多いんだけど、休みの日も結局出かけちゃうんだ。君は？","このあとまだ買い物するの？"]},
{place:"📚 図書館",cost:0,intro:"同じ棚の本を見ていた男性が、手に持っている本を見て声をかけてきた。",open:"その本、気になってたんだ。面白そう？",qs:["普段もよく本読む？","僕は数字ばっかり見る仕事だから、休みは全然違うもの読みたくなるんだ。君はどんな仕事してる？","静かな場所好き？それとも賑やかなところの方が好き？"]}
];
function goOut(){A.innerHTML=`<h2>どこへ行く？</h2><div class="card"><button class="option" onclick="meetAt(0)">☕ カフェ <span class="small">1時間 · $8</span></button><button class="option" onclick="meetAt(1)">🌳 公園 <span class="small">1時間 · 無料</span></button><button class="option" onclick="meetAt(2)">🛍️ ショッピング <span class="small">1–2時間</span></button><button class="option" onclick="meetAt(3)">📚 図書館 <span class="small">2時間 · 無料</span></button></div><button class="secondary" onclick="state.screen='day';render()">← 戻る</button>`}
function cafe(){meetAt(0)}
function meetAt(i){currentNpc=i;convoStep=0;let m=meetings[i],n=npcs[i];state.money-=m.cost;A.innerHTML=`<div class="card" style="text-align:center"><div class="portrait">${n.emoji}</div><div class="name">${n.name}, ${n.age}</div><div class="small">${n.job}</div></div><div class="card"><p class="event">${m.intro}</p><p><b>${n.name.split(" ")[0]}:</b> “${m.open}”</p><button class="option" onclick="talk()">💬 話してみる</button><button class="option" onclick="day()">👋 笑顔で別れる</button></div>`}
function talk(){convoStep=0;conversation()}
function conversation(){let n=npcs[currentNpc],m=meetings[currentNpc],name=n.name.split(" ")[0],text=convoStep===0?m.open:convoStep<=3?m.qs[convoStep-1]:`そういえば、まだ名前聞いてなかった。僕は${name}。君は？`;let html=`<h2>${m.place} · ${name}との会話</h2><div class="card"><p><b>${name}:</b> ${text}</p>`;
let choices=[
[["うん、けっこう好き","たまにかな","そうでもないかな"],["うん、よく来る","たまに来る","今日はたまたま"],["うん、初めて買う","前にも買ったことある","まだ迷ってる"],["うん、面白そう","まだ読んでないけど気になってる","別の本を探してる"]],
[["うん、働いてるよ","今日は休みだよ","仕事じゃなくて用事で来た"],["好きだよ","たまに散歩する","どちらかというと家が好き"],["ある程度決めてくる","見ながら決める","今日は見るだけ"],["よく読むよ","たまに読む","あまり読まない"]],
[["家でのんびりする","友達や家族と出かける","趣味を楽しむ"],["働いてるよ","今は仕事してない","学生だよ"],["家でゆっくりする","友達と出かける","趣味を楽しむ"],["働いてるよ","今は仕事してない","学生だよ"]],
[["あるよ","最近はあまりない","いろいろ探してる"],["あるよ","まだあまり詳しくない","最近探してる"],["うん、もう少し見る","そろそろ帰る","まだ決めてない"],["静かな方が好き","どっちも好き","賑やかな方が好き"]]
];
if(convoStep<=3){let arr=choices[convoStep][currentNpc]||choices[convoStep][0];arr.forEach(x=>html+=choice(x,convoStep+1));}
else html+=`<button class="option" onclick="askContactChoice()">${state.name||"名前"}を教えて、もう少し話す</button>`;
html+=`<button class="secondary" onclick="day()">今日は帰る</button></div>`;A.innerHTML=html}
function choice(label,next){return `<button class="option" onclick="chooseConversation(${next})">${label}</button>`}
function chooseConversation(next){convoStep=next;conversation()}
function askContactChoice(){let n=npcs[currentNpc],name=n.name.split(" ")[0];if(Math.random()<.5){A.innerHTML=`<div class="card"><p><b>${name}:</b> よかったら連絡先交換しない？</p><button class="primary" onclick="contactYes()">交換する</button><button class="secondary" onclick="day()">今日は交換しない</button></div>`}else{A.innerHTML=`<div class="card"><p><b>あなた:</b> よかったら連絡先交換しない？</p><p><b>${name}:</b> うん、いいよ。</p><button class="primary" onclick="contactYes()">交換する</button><button class="secondary" onclick="day()">やっぱりやめる</button></div>`}}
function contactYes(){let n=npcs[currentNpc];state.met=true;A.innerHTML=`<div class="card" style="text-align:center"><div class="portrait">${n.emoji}</div><h2>📱 連絡先を交換しました</h2><p><b>${n.name}</b> が連絡先に追加されました。</p><button class="primary" onclick="day()">続ける</button></div>`}
function phone(){
 A.innerHTML=`<h2>📱 スマホ</h2><div class="card"><h3>連絡先</h3><p class="small">連絡先 screen</p></div><button class="secondary" onclick="render()">← 戻る</button>${nav()}`
}
function relationships(){
 A.innerHTML=`<h2>❤️ 人間関係</h2><div class="card"><h3>知り合い</h3><p class="small">人間関係 screen</p></div><button class="secondary" onclick="render()">← 戻る</button>${nav()}`
}
function nav(){return `<div class="nav"><button class="ghost" onclick="render()">🏠 生活</button><button class="ghost" onclick="relationships()">❤️ 人間関係</button><button class="ghost" onclick="phone()">📱 スマホ</button><button class="ghost" onclick="goOut()">🗺️ 出かける</button></div>`}
function render(){var screens={title:title,create:create,quiz:quiz,day:day};(screens[state.screen]||title)()}
function bootGame(){A=document.querySelector("#app");if(!A)return;render()}
try{bootGame()}catch(e){A=document.querySelector("#app");A.innerHTML=`<div class="card"><h2>読み込みエラー</h2><p>${e.message}</p><button class="primary" onclick="location.reload()">もう一度読み込む</button></div>`}
</script></body></html>
