function npcInterests(n,i){
 const t=n.traits||{},tags=[];
 if(t.adventure>=60)tags.push("outdoor","adventure","fitness");
 if(t.social>=65)tags.push("social","nightlife","music");
 if(t.social<=40)tags.push("quiet","books","geek","movies");
 if(t.career>=65)tags.push("coffee","fitness");
 if(t.family>=65)tags.push("food","pets","calm");
 if((i%5)===0)tags.push("art","creative");
 if((i%7)===0)tags.push("games","geek");
 return [...new Set(tags)];
}
function useHours(h){
 state.periodHours=state.periodHours==null?4:state.periodHours;
 if(state.periodHours<h){
  if(state.period==="morning"){state.period="afternoon";state.time="1:00 PM";state.periodHours=4}
  else if(state.period==="afternoon"){state.period="night";state.time="7:00 PM";state.periodHours=4}
  else {state.day=(state.day||1)+1;state.energy=100;state.stress=Math.max(0,(state.stress||0)-5);state.dailyActions=0;state.period="morning";state.time="7:00 AM";state.periodHours=4;}
 }
 state.periodHours-=h;
 if(state.periodHours<=0){
  if(state.period==="morning"){state.period="afternoon";state.time="1:00 PM";state.periodHours=4}
  else if(state.period==="afternoon"){state.period="night";state.time="7:00 PM";state.periodHours=4}
 }
 return true;
}

function meetAt(placeIndex){

  const place=Number(placeIndex),m=getMeeting(place);if(!m)throw new Error("出会いデータが見つかりません");

 }

 return ["うん、そうだね","私は少し違うかな","まだわからないかな"];

function conversation(){

function choice(label,next){return `<button class="option" onclick="chooseConversation(${next})">${label}</button>`}
function chooseConversation(next){window.convoStep=next;conversation()}
function askContactChoice(){let n=npcs[window.currentNpc],name=n.name.split(" ")[0];if(Math.random()<.5){A.innerHTML=`<div class="card"><p><b>${name}:</b> よかったら連絡先交換しない？</p><button class="primary" onclick="contactYes()">交換する</button><button class="secondary" onclick="day()">今日は交換しない</button></div>`}else{A.innerHTML=`<div class="card"><p><b>あなた:</b> よかったら連絡先交換しない？</p><p><b>${name}:</b> うん、いいよ。</p><button class="primary" onclick="contactYes()">交換する</button><button class="secondary" onclick="day()">やっぱりやめる</button></div>`}}
function contactYes(){let n=npcs[window.currentNpc];state.met=true;if(!Array.isArray(state.contacts))state.contacts=[];if(!state.contacts.includes(window.currentNpc))state.contacts.push(window.currentNpc);A.innerHTML=`<div class="card" style="text-align:center"><div class="portrait">${n.emoji}</div><h2>📱 連絡先を交換しました</h2><p><b>${n.name}</b> が連絡先に追加されました。</p><button class="primary" onclick="day()">続ける</button></div>`}
function phone(){
 const ids=Array.isArray(state.contacts)?state.contacts:[];
 const list=ids.length?ids.map(i=>{const n=npcs[i];return `<button class="option" onclick="openContact(${i})"><span style="font-size:28px;margin-right:10px">${n.emoji}</span><b>${n.name}</b><br><span class="small">${n.age}歳 · ${n.job}</span></button>`}).join(""):'<p class="small">まだ連絡先を交換した人はいません。</p>';
 A.innerHTML=`<h2>📱 スマホ</h2><div class="card"><h3>連絡先</h3>${list}</div><button class="secondary" onclick="state.screen='day';render()">← 戻る</button>${nav()}`;
}
function affinity(i){if(!state.affinity)state.affinity={};return state.affinity[i]||0}
function addAffinity(i,n){if(!state.affinity)state.affinity={};state.affinity[i]=Math.max(0,Math.min(100,affinity(i)+n))}
function openContact(i){
 const n=npcs[i],a=affinity(i);
 A.innerHTML=`<h2>📱 ${n.name}</h2><div class="card" style="text-align:center"><div class="portrait">${n.emoji}</div><h3>${n.name}</h3><p class="small">${n.age}歳 · ${n.job}</p><button class="primary" onclick="messageMenu(${i})">💬 メッセージ</button><button class="secondary" onclick="phone()">← 連絡先へ</button></div>`;
}
const chatCategories=[
 {name:"日常",icon:"☀️",topics:["今日あったこと","仕事","ランチ","帰り道","天気","眠い","最近忙しい？","今日の予定"]},
 {name:"趣味",icon:"🎧",topics:["音楽","映画","ドラマ","ゲーム","本","スポーツ","料理","写真"]},
 {name:"好きなもの",icon:"🍜",topics:["好きな食べ物","コーヒー","甘いもの","お酒","好きな店","服","旅行先","季節"]},
 {name:"もっと知りたい",icon:"💭",topics:["休日の過ごし方","子どもの頃","学生時代","友達","ペット","得意なこと","苦手なこと","最近ハマってること"]},
 {name:"価値観",icon:"🌱",topics:["仕事と生活","家族","お金の使い方","一人の時間","連絡頻度","将来","住みたい場所","人生で大切なこと"]},
 {name:"恋愛",icon:"💕",topics:["理想のデート","恋人との距離感","好きなタイプ","記念日","嫉妬","結婚","一緒に住むこと","恋人に求めること"]},
 {name:"ふざける",icon:"😂",topics:["もし宝くじが当たったら","無人島に持っていくもの","変な食べ合わせ","子どもの頃の黒歴史","超能力なら何がいい？","急に休みになったら","犬派猫派","朝型夜型"]}
];
const chatOpeners=["今日はどうだった？","そういえば聞いてみたかったんだけど","ふと思ったんだけど","ねえ、ちょっと聞いていい？","この前から気になってたんだけど","急に思い出した（笑）","ところでさ","全然関係ないんだけど"];
const chatReplies=["それ、けっこうわかる。僕も似たようなことあるよ。","へえ、そうなんだ。もう少し聞きたい。","それいいね。なんか君らしい気がする。","僕はちょっと違うかも。でもその考え方もわかる。","面白いね。今度会ったときにもその話しようよ。","それ初めて聞いた。意外かも。","いい質問だね。僕ならたぶんそうするかな。","なんか話してたら時間あっという間だね。"];
function allChatTopics(){return chatCategories.flatMap((c,ci)=>c.topics.map((t,ti)=>({category:c.name,icon:c.icon,topic:t,ci,ti})))}
function chatVariant(i,topicIndex){
 const list=allChatTopics(),d=state.day||1,a=affinity(i),seed=d*37+i*71+a*13+(state.dailyActions||0)*17;
 const x=list[topicIndex==null?seed%list.length:Number(topicIndex)%list.length];
 return {category:x.category,icon:x.icon,topic:x.topic,opener:chatOpeners[Math.floor(seed/3+x.ti)%chatOpeners.length],reply:chatReplies[Math.floor(seed/7+x.ci)%chatReplies.length],id:(seed+x.ci*83+x.ti*19)%2000+1};
}
function messageMenu(i){
 const n=npcs[i];
 A.innerHTML=`<h2>💬 ${n.name}</h2><div class="card"><button class="option" onclick="topicMenu(${i})">💬 話題を選んで話す</button><button class="option" onclick="randomMessage(${i})">🎲 おまかせで話す</button><button class="option" onclick="askDate(${i})">💕 デートに誘う</button><button class="secondary" onclick="openContact(${i})">← 戻る</button></div>`;
}
function randomMessage(i){
 const list=allChatTopics();
 const seed=(state.day||1)*97+i*43+(state.chatCount&&state.chatCount[i]||0)*31+(state.period==="afternoon"?11:state.period==="night"?23:5);
 casualMessage(i,seed%list.length);
}
function startSelectedTopic(){const sel=document.getElementById("topicSelect");if(!sel)return;const ci=Number(sel.value),person=Number(window.activeTopicPerson);let start=0;for(let x=0;x<ci;x++)start+=chatCategories[x].topics.length;const count=chatCategories[ci].topics.length;casualMessage(person,start+(((state.day||1)*31+person*13)%count));}
window.startSelectedTopic=startSelectedTopic;
function topicMenu(i){
 window.activeTopicPerson=Number(i);
 A.innerHTML=`<h2>💬 何を話す？</h2><div class="card"><label class="small">話題カテゴリー</label><select id="topicSelect" onchange="startSelectedTopic()" style="width:100%;padding:18px;margin:12px 0 18px;border:1px solid #ddd;border-radius:18px;font-size:18px;background:white">${chatCategories.map((c,ci)=>`<option value="${ci}">${c.icon} ${c.name}</option>`).join("")}</select><button type="button" class="primary" id="topicSendBtn">この話題でメッセージする</button></div><button type="button" class="secondary" id="messageTopicBack">← 戻る</button>`;
 document.getElementById("topicSendBtn").onclick=startSelectedTopic;
 document.getElementById("messageTopicBack").onclick=function(){messageMenu(Number(window.activeTopicPerson));};
}
window.topicMenu=topicMenu;
function replyTiming(i){
 const n=npcs[i];
 if(!n)return "返信なし";
 if(n.textStyle==="frequent")return "すぐに返信がきた。";
 if(n.textStyle==="space")return "少し時間がたってから返信がきた。";
 return "しばらくして返信がきた。";
}
function casualMessage(i,topicIndex){
 if(!useHours(2)){A.innerHTML=`<div class="card"><h2>⏰ メッセージする時間が足りない</h2><button class="primary" onclick="day()">戻る</button></div>`;return}
 if(!state.chatCountDay)state.chatCountDay={};if(!state.chatCount)state.chatCount={};
 const n=npcs[i],today=state.day||1;
 if(state.chatCountDay[i]!==today){state.chatCountDay[i]=today;state.chatCount[i]=0}
 state.chatCount[i]=(state.chatCount[i]||0)+1;
 const count=state.chatCount[i];
 const v=chatVariant(i,Number(topicIndex)<0?null:topicIndex);let gain=0,reaction="",timing=replyTiming(i);
 if(n.textStyle==="frequent"){
   gain=count<=3?4:0;
   reaction=count<=3?`メッセージが好きみたい。今日${count}回目の会話も楽しそう。`:"たくさん話せて満足しているみたい。これ以上は今日は親密度は上がらない。";
 }else if(n.textStyle==="space"){
   if(count>=3)gain=-2-(count-3);
   else gain=count===1?2:0;
   reaction=count>=3?`連絡が多すぎると感じているみたい。今日${count}回目なので少し距離を置きたそう。`:"返信はくるけど、頻繁なメッセージはあまり好きではなさそう。";
 }else{
   gain=count<=2?2:0;
   reaction=count<=2?"自然に会話が続いた。":"今日は十分話したみたい。親密度はこれ以上上がらない。";
 }
 addAffinity(i,gain);
 const you=["私はけっこう好きかも。","最近ちょうど気になってた。","それについて話したかった！","私はこういうの、わりと大事だと思う。","うーん、私は少し違うかな。","それ面白いね。私はどうだろう。","わかる！私も似た感じ。","へえ、もっと聞きたい。"][(v.id+count)%8];
 A.innerHTML=`<h2>${v.icon} ${v.topic}</h2><div class="card"><p><b>${n.name.split(" ")[0]}:</b> ${v.opener} 「${v.topic}」ってどう思う？</p><p><b>あなた:</b> ${you}</p><p><b>${n.name.split(" ")[0]}:</b> ${v.reply}</p><div class="event">${timing}<br>${reaction}</div><button class="primary" onclick="messageMenu(${i})">💬 もう一度メッセージする</button><button class="secondary" onclick="openContact(${i})">← 戻る</button></div>`;
}
function askDate(i){
 const n=npcs[i],a=affinity(i);
 let threshold=n.dateStyle==="casual"?8:n.dateStyle==="balanced"?25:42;
 const available=npcAvailable(i),accepted=a>=threshold&&available;
 if(accepted){addAffinity(i,5);A.innerHTML=`<div class="card"><h2>💕 デートの約束</h2><p><b>あなた:</b> 今度、二人で出かけない？</p><p><b>${n.name.split(" ")[0]}:</b> ${n.dateStyle==="casual"?"もちろん。楽しそう、行こう！":"いいね。行こう！"}</p><button class="primary" onclick="dateScene(${i})">デートへ</button><button class="secondary" onclick="messageMenu(${i})">あとで</button></div>`}
 else A.innerHTML=`<div class="card"><h2>💬 ${n.name}</h2><p><b>${n.name.split(" ")[0]}:</b> ${!available?"今日は予定が合わなさそう。また別の時間に誘って。":"ごめん、もう少しお互いを知ってからがいいかな。"}</p><button class="primary" onclick="messageMenu(${i})">戻る</button></div>`;
}
function incomingDate(i){
 const n=npcs[i];A.innerHTML=`<div class="card"><h2>📩 ${n.name}</h2><p><b>${n.name.split(" ")[0]}:</b> 今度${n.schedule==="weekendday"?"休日の昼":n.schedule==="flexible"?"時間あるとき":n.schedule==="shift"?"予定が合う日":"夜"}、時間ある？よかったら一緒に出かけない？</p><button class="primary" onclick="dateScene(${i})">💕 行く</button><button class="secondary" onclick="messageMenu(${i})">今回はやめておく</button></div>`;
}
function morningMessage(){
 const ids=Array.isArray(state.contacts)?state.contacts:[]; if(!ids.length)return "";
 const eligible=ids.filter(i=>affinity(i)>=12);
 if(!eligible.length)return "";
 const day=state.day||1, i=eligible[(day*7)%eligible.length],n=npcs[i];
 const chance=n.textStyle==="frequent"?2:n.textStyle==="warm"?4:6;
 if((day+i*3)%chance!==0)return "";
 addAffinity(i,2);
 return `<div class="card"><h3>📩 朝のメッセージ</h3><p><b>${n.name.split(" ")[0]}:</b> おはよう。今日は何してる？</p><button class="option" onclick="messageMenu(${i})">返信する</button></div>`;
}
function dateScene(i){
 if((state.dailyActions||0)>=(state.maxDailyActions||4)){A.innerHTML='<div class="card"><h2>🌙 今日はもう疲れた</h2><p>今日はこれ以上デートできません。</p><button class="primary" onclick="day()">戻る</button></div>';return}
 state.dailyActions=(state.dailyActions||0)+2;
 const n=npcs[i];addAffinity(i,10);state.stress=Math.max(0,(state.stress||0)-12);state.energy=Math.max(0,(state.energy||0)-15);
 A.innerHTML=`<div class="card" style="text-align:center"><div class="portrait">${n.emoji}</div><h2>💕 ${n.name}とデート</h2><p>カフェでゆっくり話して、一緒に街を歩いた。前より少し自然に話せるようになった。</p><p class="small">💗 +10　🧠 ストレス -12　⚡ -15</p><button class="primary" onclick="day()">デートを終える</button></div>`;
}
function relationships(){
 A.innerHTML=`<h2>❤️ 人間関係</h2><div class="card"><h3>知り合い</h3><p class="small">人間関係 screen</p></div><button class="secondary" onclick="render()">← 戻る</button>${nav()}`
}
function nav(){return `<div class="nav"><button class="ghost" onclick="render()">🏠 生活</button><button class="ghost" onclick="relationships()">❤️ 人間関係</button><button class="ghost" onclick="phone()">📱 スマホ</button><button class="ghost" onclick="goOut()">🗺️ 出かける</button></div>`}
function render(){saveGame();var screens={title:title,create:create,quiz:quiz,day:day};(screens[state.screen]||title)()}
function bootGame(){
 if(!A)return;
 loadGame();
 setInterval(saveGame,3000);
 window.addEventListener("beforeunload",saveGame);
 window.nextPeriod=nextPeriod; window.goOut=goOut; window.meetAt=meetAt; window.getMeeting=getMeeting; window.talk=talk; window.day=day; window.endDay=endDay;
 window.work=work; window.shopping=shopping; window.buyItem=buyItem; window.refresh=refresh; window.render=render; window.conversation=conversation; window.chooseConversation=chooseConversation;
 window.randomMessage=randomMessage; window.topicMenu=topicMenu; window.casualMessage=casualMessage; window.morningMessage=morningMessage; window.askContactChoice=askContactChoice; window.contactYes=contactYes; window.phone=phone; window.openContact=openContact; window.messageMenu=messageMenu; window.casualMessage=casualMessage; window.askDate=askDate; window.incomingDate=incomingDate; window.dateScene=dateScene; window.relationships=relationships;
 render();
}
document.addEventListener("click",function(e){
 const shop=e.target.closest&&e.target.closest("[data-shop]");
 if(shop){e.preventDefault();buyItem(Number(shop.getAttribute("data-shop")));return}
 const back=e.target.closest&&e.target.closest("[data-shop-back]");
 if(back){e.preventDefault();day();return}
});
document.addEventListener("click",function(e){
 const b=e.target.closest&&e.target.closest("[data-go-place]");
 if(b){e.preventDefault();meetAt(Number(b.getAttribute("data-go-place")))}
});
try{bootGame()}catch(e){A=document.querySelector("#app");A.innerHTML=`<div class="card"><h2>読み込みエラー</h2><p>${e.message}</p><button class="primary" onclick="location.reload()">もう一度読み込む</button></div>`}
</script></body></html>
