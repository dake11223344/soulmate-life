function openContact(i){const n=npcs[i];state.unread[i]=0;(state.inbox||[]).forEach(m=>{if(m.person===i)m.read=true});save();const msgs=(state.inbox||[]).filter(m=>m.person===i).slice(-4).map(m=>'<div class="event"><b>'+n.name.split(" ")[0]+':</b> '+m.text+'</div>').join("");A.innerHTML='<div class="portrait">'+n.emoji+'</div><h2>'+n.name+'</h2><div class="card">'+msgs+'<button class="btn primary" onclick="messageMenu('+i+')">💬 メッセージ</button><button class="btn secondary" onclick="phone()">← 戻る</button></div>'+nav()}

function sendCategory(ci){const i=Number(state.messagePerson),c=cats[ci];if(!npcs[i]||!c)return;const count=(state.chatCount[i]||0);const topic=c[2][((state.day*7+i*11+count*3)%c[2].length)];sendMessage(i,c[0],topic)}

function sendMessage(i,icon,topic){const n=npcs[i];spendMessageTime();state.chatCount[i]=(state.chatCount[i]||0)+1;const k=state.chatCount[i];const replies=["それ、わかる。僕も気になってた。","へえ、もっと聞きたい。","いいね。今度会った時にも話そう。","僕は少し違うけど、その考え方も好きだよ。"];const yours=["私はけっこう好き。","最近ちょうど気になってた。","私はどうかなって考えてた。","それ面白いね！"];if(!state.affinity[i])state.affinity[i]=0;state.affinity[i]+=n.textStyle==="frequent"&&k<=3?4:n.textStyle==="space"&&k>=3?-2:2;if(((state.day*13+i*17+k*19)%(n.textStyle==="frequent"?3:n.textStyle==="space"?9:5))===0)queueIncoming(i);save();A.innerHTML='<h2>'+icon+' '+topic+'</h2><div class="card"><p><b>'+n.name.split(" ")[0]+':</b> 「'+topic+'」ってどう思う？</p><p><b>あなた:</b> '+yours[k%yours.length]+'</p><p><b>'+n.name.split(" ")[0]+':</b> '+replies[(state.day+i+k)%replies.length]+'</p><button class="btn primary" onclick="messageMenu('+i+')">もう一度メッセージ</button><button class="btn secondary" onclick="openContact('+i+')">← 戻る</button></div>'+nav()}
function queueIncoming(i){if(!npcs[i])return;const texts=["今なにしてる？","今日どうだった？","さっきの話、ちょっと気になってた。","ふと思い出してメッセージした（笑）","また話したくなった。"];state.inbox.push({person:i,text:texts[(state.day+i+state.inbox.length)%texts.length],read:false});state.unread[i]=(state.unread[i]||0)+1}
function maybeIncoming(){ensureContacts();state.contacts.forEach(i=>{const n=npcs[i],a=state.affinity[i]||0;if(a<4)return;const d=n.textStyle==="frequent"?3:n.textStyle==="space"?10:6;if((state.day*11+i*7+(state.period==="night"?3:1))%d===0)queueIncoming(i)})}
function relationships(){ensureContacts();A.innerHTML='<h2>❤️ 人間関係</h2><div class="card">'+state.contacts.map(i=>'<p>'+npcs[i].emoji+' '+npcs[i].name+'</p>').join("")+'</div>'+nav()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(b){e.preventDefault();sendCategory(Number(b.dataset.cat))}});
function boot(){load();ensureContacts();home()}
try{boot()}catch(e){A.innerHTML='<div class="card"><h2>起動エラー</h2><p>'+String(e.message||e)+'</p></div>'}
</script></body></html>
